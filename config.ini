# =============================================================================
# SNIPER PHOENIX V8.3.1 - CONFIGURAÇÕES
# Estratégia: V18 Trend Rider Adaptativo
# =============================================================================

[binance]
# Credenciais da API Binance (deixe vazio para modo backtest/simulação)
api_key = 
secret = 

[mercado]
# Par de negociação
symbol = AXS/USDT
# Capital total disponível para trading
capital_total = 100.0
# Capital base para cálculo de risco
capital_base = 100.0
# Taxa de corretagem em porcentagem (0.075% = 0.00075 por trade)
fee_pct = 0.075

[trading]
# Timeframe para análise
timeframe = 5m
# Cooldown entre entradas (em candles)
entry_cooldown = 1
# Período do ATR para cálculo de volatilidade
atr_period = 14

[regime]
# Parâmetros de detecção de regime de mercado
adx_period = 14
ema_period = 200
adx_thresh = 25.0
crash_pct = 8.0
crash_lookback = 20
# Habilitar detecção de mercado lateral
lateral_enabled = False

[drawdown]
# Filtro de drawdown máximo
lookback_days = 90
max_pct = 40.0
enabled = True

[entry]
# Filtros de entrada
rsi_threshold = 15
wick_ratio = 0.25
volume_mult = 1.2
reversal_enabled = True

# Parâmetros específicos da estratégia V18 Trend Rider
# BULLISH regime parameters
rsi_period = 14

[tp_sl]
# Take Profit e Stop Loss por regime (em porcentagem)
# Nota: Na V18, SL e TP são calculados dinamicamente via ATR
# Estes valores servem como fallback
tp_bearish = 0.8
sl_bearish = 3.0
tp_bullish = 2.0
sl_bullish = 3.0
tp_lateral = 1.2
sl_lateral = 2.0

[trend]
# Configurações da estratégia Trend Following
breakout_enabled = False
breakout_period = 20
breakout_trailing_atr_factor = 2.0
breakout_min_volume_ratio = 1.2

pullback_enabled = True
pullback_ema_period = 21
pullback_max_distance_pct = 1.5
pullback_confirmation = True
pullback_trailing_atr_factor = 1.5
pullback_min_volume_ratio = 1.0

momentum_enabled = False
momentum_rsi_threshold = 65
momentum_trailing_atr_factor = 2.5
momentum_min_volume_ratio = 1.2

# Multiplicador de capital para trades de tendência
trend_capital_multiplier = 1.0
# Usar trailing stop dinâmico
trend_use_trailing = True
# Take profit para trades de tendência (fallback)
tp_trend = 3.0
# Ativação do trailing stop (% de lucro)
trend_trailing_activation_pct = 0.5

[v18_params]
# =============================================================================
# PARÂMETROS ESPECÍFICOS DA ESTRATÉGIA V18 TREND RIDER ADAPTATIVO
# =============================================================================
# Estes parâmetros controlam o comportamento adaptativo por regime

# Regime BULLISH (tendência de alta)
v18_bullish_sl_mult = 2.0        # Stop Loss = 2.0x ATR
v18_bullish_trail_dist = 3.5     # Distância do Trailing Stop = 3.5x ATR
v18_bullish_trail_limiar = 2.0   # Ativar trailing após 2.0x ATR de lucro
v18_bullish_adx_min = 20         # ADX mínimo para entrada
v18_bullish_rsi_max = 75         # RSI máximo (evitar sobrecompra)

# Regime BEARISH (tendência de baixa)
v18_bearish_sl_mult = 1.2        # Stop Loss = 1.2x ATR (mais apertado)
v18_bearish_trail_dist = 1.5     # Distância do Trailing Stop = 1.5x ATR
v18_bearish_trail_limiar = 0.6   # Ativar trailing após 0.6x ATR de lucro
v18_bearish_adx_min = 15         # ADX mínimo para entrada (menor threshold)
v18_bearish_rsi_max = 60         # RSI máximo (mais conservador)

# Detecção de regime
# BULLISH: Preço > EMA200 E EMA9 > EMA21
# BEARISH: Preço < EMA200 E EMA9 < EMA21
# NEUTRO: Condições mistas ou sem tendência clara
v18_regime_ema_fast = 9          # EMA rápida para detecção
v18_regime_ema_slow = 21         # EMA lenta para detecção
v18_regime_ema_trend = 200       # EMA de tendência principal

[risk]
# Gestão de risco
risk_per_trade = 0.01        # 1 por cento do capital por trade
